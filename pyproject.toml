[project]
name = "robot-exorcist"
version = "0.1.0"
description = "A CrewAI swarm that diagnoses a 'possessed' robot from its logs, grounds the diagnosis with You.com, reasons with Parasail, and acts through One."
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "crewai>=1.13.0",
    "crewai-tools>=1.0.0",
    "openai>=1.60",
    "httpx>=0.27",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "numpy>=1.26",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "mcp>=1.10",
]

[project.scripts]
exorcist = "exorcist.__main__:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["exorcist"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
