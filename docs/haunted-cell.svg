<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" font-family="-apple-system,Inter,Segoe UI,Roboto,sans-serif" font-size="13">
  <defs><style>
    .t{fill:#e7e9f0}.m{fill:#8a90a3;font-size:11.5px}.err{fill:#ff5d5d}.acc{fill:#ff7a1a}
    .node{fill:#171b26;stroke:#ff5d5d;stroke-width:1.5}.psu{fill:#2a1a10;stroke:#ff7a1a;stroke-width:2}
    .wire{fill:none;stroke:#ff7a1a;stroke-width:2.5;stroke-dasharray:6 4}
    .ico{fill:none;stroke:#e7e9f0;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  </style></defs>
  <rect width="1000" height="300" fill="#0a0c12"/>
  <text x="20" y="30" class="t" font-size="18" font-weight="700">The problem: three ghosts that are really one</text>
  <text x="20" y="50" class="m">Each subsystem has a plausible local explanation. Only the timeline across all three logs, plus the cell's wiring, shows the shared cause.</text>

  <!-- PSU -->
  <g transform="translate(40,120)">
    <rect class="psu" width="175" height="80" rx="10"/>
    <g class="ico" transform="translate(14,16) scale(1.6)"><path d="M13 2L5 13h6l-1 9 8-12h-6z"/></g>
    <text x="56" y="34" class="t" font-weight="700">Bench PSU B-3</text>
    <text x="58" y="52" class="m">circuit 14, shared with</text><text x="58" y="66" class="m">space heater + 3D printers</text>
  </g>
  <path class="wire" d="M215 160 C 255 160, 255 95, 290 95"/>
  <path class="wire" d="M215 160 C 255 160, 255 160, 290 160"/>
  <path class="wire" d="M215 160 C 255 160, 255 225, 290 225"/>

  <!-- UR5e -->
  <g transform="translate(290,70)">
    <rect class="node" width="370" height="50" rx="8"/>
    <g class="ico" transform="translate(10,13)"><path d="M4 20h8M8 20v-4l5-6 3 2-4 6M13 10l4-5 2 1-3 5M17 5l1-2"/></g>
    <text x="44" y="21" class="t" font-weight="700">UR5e arm</text>
    <text x="44" y="38" class="err">C204A0 protective stop ×5, joint 3 deviation, driver timeouts</text>
  </g>
  <!-- gripper -->
  <g transform="translate(290,135)">
    <rect class="node" width="370" height="50" rx="8"/>
    <g class="ico" transform="translate(10,13)"><path d="M12 3v6M7 9h10v3H7zM8 12l-2 7M16 12l2 7M6 19h3M15 19h3"/></g>
    <text x="44" y="21" class="t" font-weight="700">Dynamixel gripper</text>
    <text x="44" y="38" class="err">error 0x21 (input voltage + overload) ×5, 10.6 V → 9.7 V</text>
  </g>
  <!-- AMR -->
  <g transform="translate(290,200)">
    <rect class="node" width="370" height="50" rx="8"/>
    <g class="ico" transform="translate(10,13)"><path d="M4 14h16v4H4zM7 14v-4h10v4M12 10V7M10 7h4"/><circle cx="7" cy="19" r="1.6"/><circle cx="17" cy="19" r="1.6"/></g>
    <text x="44" y="21" class="t" font-weight="700">TurtleBot4 AMR</text>
    <text x="44" y="38" class="err">RPLIDAR timeouts ×5, Nav2 stuck, dock voltage sag</text>
  </g>

  <!-- the local explanations vs the real one -->
  <g transform="translate(690,70)">
    <text x="0" y="14" class="m">What each log suggests on its own</text>
    <text x="0" y="36" class="t">· bad trajectory / payload config</text>
    <text x="0" y="56" class="t">· worn gear, mechanical binding</text>
    <text x="0" y="76" class="t">· dying lidar, USB cable</text>
    <text x="0" y="108" class="m">What the timeline says</text>
    <text x="0" y="130" class="acc" font-weight="700">all three fail within 700 ms,</text>
    <text x="0" y="148" class="acc" font-weight="700">five times (02:01, 02:03, 02:07,</text>
    <text x="0" y="166" class="acc" font-weight="700">02:10, 02:16): one brownout.</text>
    <text x="0" y="196" class="m">Red herring: TF_REPEATED_DATA warnings</text><text x="0" y="212" class="m">between bursts. Benign, and the swarm says so.</text>
  </g>
</svg>
